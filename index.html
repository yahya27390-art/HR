<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('theme') === 'dark' || 
                       localStorage.getItem('hr_flow_is_dark') === 'true' || 
                       (!('theme' in localStorage) && !('hr_flow_is_dark' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/company-logo.png" />
    <link rel="apple-touch-icon" href="/company-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="درة السيارة HR - نظام إدارة الموارد البشرية والخدمة الذاتية السحابي الموحد" />
    <link rel="manifest" href="/manifest.json" />
    <title>درة السيارة HR | نظام إدارة الموارد البشرية والخدمة الذاتية</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
