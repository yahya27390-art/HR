<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dcBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="gearShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e40af" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="90" fill="#ffffff" />
  
  <g transform="translate(250, 250)" filter="url(#gearShadow)">
    <!-- 12-Tooth Clean Automotive Gear -->
    <path fill="url(#dcBlueGrad)" d="
      M -38,-195 L 38,-195 L 48,-160 L 98,-140 L 135,-165 L 180,-120 L 155,-83 L 175,-33 L 210,-23 L 210,23 L 175,33 L 155,83 L 180,120 L 135,165 L 98,140 L 48,160 L 38,195 L -38,195 L -48,160 L -98,140 L -135,165 L -180,120 L -155,83 L -175,33 L -210,23 L -210,-23 L -175,-33 L -155,-83 L -180,-120 L -135,-165 L -98,-140 L -48,-160 Z
    " />

    <!-- Outer Chrome Ring -->
    <circle cx="0" cy="0" r="145" fill="#ffffff" />
    <circle cx="0" cy="0" r="135" fill="none" stroke="#e2e8f0" stroke-width="4" />

    <!-- Inner Blue Core -->
    <circle cx="0" cy="0" r="120" fill="url(#dcBlueGrad)" />

    <!-- Core Inner White Background for Monogram -->
    <circle cx="0" cy="0" r="105" fill="#ffffff" />

    <!-- Elegant DC Monogram -->
    <g transform="translate(0, 0)">
      <!-- Letter D -->
      <path d="M -75,-60 L -35,-60 C 0,-60 20,-40 20,0 C 20,40 0,60 -35,60 L -75,60 Z M -55,-40 L -55,40 L -35,40 C -12,40 0,25 0,0 C 0,-25 -12,-40 -35,-40 Z" fill="url(#dcBlueGrad)" />
      
      <!-- Letter C -->
      <path d="M 60,-45 C 50,-55 35,-60 15,-60 C -10,-60 -25,-45 -25,-25 L -5,-25 C -5,-35 5,-42 18,-42 C 30,-42 40,-35 45,-25 L 68,-38 Z M 68,38 L 45,25 C 40,35 30,42 18,42 C 5,42 -5,35 -5,25 L -25,25 C -25,45 -10,60 15,60 C 35,60 50,55 60,45 Z" fill="#0284c7" />
    </g>

    <!-- Center Accent Dot -->
    <circle cx="0" cy="0" r="10" fill="url(#dcBlueGrad)" />
  </g>
</svg>